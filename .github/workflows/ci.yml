name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src
      # Route types like LayoutProps are generated by Next, not checked in.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
